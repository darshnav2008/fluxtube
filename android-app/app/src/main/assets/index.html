<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fluxtube</title>
  <style>
    :root {
      --bg: #09080b;
      --surface: rgba(20, 18, 25, 0.9);
      --text: #f7f6f9;
      --muted: #938e9c;
      --accent: #ff3e6c;
      --accent-soft: #ff7096;
      --accent-grad: linear-gradient(135deg, #ff7b9c 0%, #ff3d6e 55%, #e62256 100%);
      --accent-dim: rgba(255, 62, 108, 0.14);
      --accent-border: rgba(255, 62, 108, 0.36);
      --border: rgba(255, 255, 255, 0.1);
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(360px circle at 95% 8%, rgba(255, 38, 92, 0.32), transparent 62%),
        radial-gradient(340px circle at 5% 94%, rgba(225, 24, 78, 0.28), transparent 60%),
        #09080b;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 16px 40px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.2em;
      font-size: 1rem;
    }
    .btn-engine {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .hero { text-align: center; margin-bottom: 22px; }
    .hero h1 {
      font-size: 2rem;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .hero h1 span {
      font-style: italic;
      background: linear-gradient(90deg, #ff7096, #ff3667);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subline {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .engine-pill {
      display: inline-block;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent-soft);
      margin-bottom: 14px;
    }
    .url-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .url-input {
      width: 100%;
      background: rgba(9, 8, 11, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }
    .url-input:focus { border-color: var(--accent); }
    .url-actions { display: flex; gap: 8px; }
    .btn-ghost {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn-primary {
      flex: 1;
      background: var(--accent-grad);
      color: #0b080c;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 0.92rem;
    }
    .btn-primary:disabled { opacity: 0.6; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-size: 0.76rem;
      color: #d6d2de;
    }
    .error-banner {
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 46, 99, 0.16);
      border: 1px solid var(--accent-border);
      color: #ff9cb5;
      font-size: 0.82rem;
      margin-bottom: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .thumb-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #0d0b10;
      margin-bottom: 12px;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pill-dur {
      position: absolute; bottom: 8px; left: 8px;
      background: rgba(9, 8, 11, 0.88);
      padding: 3px 8px; border-radius: 8px; font-size: 0.74rem; font-weight: 700;
    }
    .pill-plat {
      position: absolute; top: 8px; right: 8px;
      background: var(--accent-grad); color: #0b080c;
      padding: 3px 9px; border-radius: 999px; font-size: 0.68rem; font-weight: 800;
    }
    .v-title { font-size: 1rem; font-weight: 700; line-height: 1.35; margin-bottom: 12px; }
    .trim-box {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .trim-top {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; font-weight: 700; margin-bottom: 10px;
    }
    .trim-badge {
      font-size: 0.68rem; padding: 3px 8px; border-radius: 999px;
      background: var(--accent-dim); color: var(--accent-soft);
    }
    .time-row {
      display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: end;
    }
    .time-field label { display: block; font-size: 0.62rem; color: var(--muted); margin-bottom: 4px; }
    .time-field input {
      width: 100%; background: #09080b; border: 1px solid var(--border);
      border-radius: 9px; padding: 8px; color: var(--text); text-align: center;
      font-family: monospace; font-size: 0.86rem; font-weight: 700;
    }
    .btn-reset {
      background: rgba(255, 255, 255, 0.07); border: 1px solid var(--border);
      color: var(--text); border-radius: 9px; padding: 9px 10px; font-size: 0.74rem;
    }
    .q-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px;
    }
    .q-card {
      text-align: left; padding: 12px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
      color: var(--text);
    }
    .q-card.selected {
      background: var(--accent-grad); color: #0b080c; border-color: transparent;
    }
    .q-top { display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: 700; margin-bottom: 4px; }
    .q-res { font-size: 1.1rem; font-weight: 800; }
    .q-sub { font-size: 0.72rem; opacity: 0.82; }
    .progress-box {
      margin-top: 12px; padding: 12px; border-radius: 14px;
      background: var(--accent-dim); border: 1px solid var(--accent-border);
    }
    .progress-top { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
    .track { height: 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
    .fill { height: 100%; background: var(--accent-grad); width: 0%; transition: width 0.2s; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Fluxtube</div>
    <button class="btn-engine" id="updateBtn" type="button">Update Engine</button>
  </header>

  <section class="hero" id="heroTop">
    <div class="engine-pill" id="engineStatus">Starting engine...</div>
    <h1>Download <span>video</span><br />locally</h1>
    <div class="subline">PASTE • CLIP • SAVE TO GALLERY</div>
  </section>

  <div class="url-box">
    <input id="urlInput" class="url-input" type="url" placeholder="Paste YouTube, Instagram, TikTok or Facebook link..." />
    <div class="url-actions">
      <button id="pasteBtn" class="btn-ghost" type="button">Paste</button>
      <button id="fetchBtn" class="btn-primary" type="button">Fetch →</button>
    </div>
  </div>

  <div class="chips" id="chipsRow">
    <span class="chip">YouTube</span>
    <span class="chip">Instagram</span>
    <span class="chip">TikTok</span>
    <span class="chip">Facebook</span>
  </div>

  <div id="errorBanner" class="error-banner" hidden></div>

  <section id="workspace" hidden>
    <div class="card">
      <div class="thumb-wrap">
        <img id="vThumb" src="" alt="" />
        <span class="pill-dur" id="vDur">0:00</span>
        <span class="pill-plat" id="vPlat">YouTube</span>
      </div>
      <div class="v-title" id="vTitle">Video Title</div>

      <div class="trim-box">
        <div class="trim-top">
          <span>Clip Time Range</span>
          <span class="trim-badge" id="clipBadge">Full Video</span>
        </div>
        <div class="time-row">
          <div class="time-field">
            <label for="fromInput">FROM</label>
            <input id="fromInput" type="text" value="0:00" />
          </div>
          <div style="padding-bottom:9px;color:#ff7096;">→</div>
          <div class="time-field">
            <label for="toInput">TO</label>
            <input id="toInput" type="text" value="0:00" />
          </div>
          <button id="resetTrim" class="btn-reset" type="button">Reset</button>
        </div>
      </div>

      <div class="q-grid" id="qGrid"></div>

      <button id="dlBtn" class="btn-primary" style="width:100%;" type="button">Download to Phone</button>

      <div id="progressBox" class="progress-box" hidden>
        <div class="progress-top">
          <span id="pStage">Starting...</span>
          <span id="pPct">0%</span>
        </div>
        <div class="track"><div id="pFill" class="fill"></div></div>
      </div>
    </div>
  </section>

  <script>
    const urlInput = document.getElementById("urlInput");
    const pasteBtn = document.getElementById("pasteBtn");
    const fetchBtn = document.getElementById("fetchBtn");
    const updateBtn = document.getElementById("updateBtn");
    const engineStatus = document.getElementById("engineStatus");
    const errorBanner = document.getElementById("errorBanner");
    const workspace = document.getElementById("workspace");
    const heroTop = document.getElementById("heroTop");
    const chipsRow = document.getElementById("chipsRow");
    const vThumb = document.getElementById("vThumb");
    const vDur = document.getElementById("vDur");
    const vPlat = document.getElementById("vPlat");
    const vTitle = document.getElementById("vTitle");
    const fromInput = document.getElementById("fromInput");
    const toInput = document.getElementById("toInput");
    const resetTrim = document.getElementById("resetTrim");
    const clipBadge = document.getElementById("clipBadge");
    const qGrid = document.getElementById("qGrid");
    const dlBtn = document.getElementById("dlBtn");
    const progressBox = document.getElementById("progressBox");
    const pStage = document.getElementById("pStage");
    const pPct = document.getElementById("pPct");
    const pFill = document.getElementById("pFill");

    let currentVideo = null;
    let selectedQ = "best_1080";

    window.onEngineStatus = (ready, msg) => {
      engineStatus.textContent = msg;
    };

    pasteBtn.addEventListener("click", () => {
      if (window.FluxAndroid) {
        const txt = window.FluxAndroid.getClipboard();
        if (txt) urlInput.value = txt.trim();
      }
    });

    updateBtn.addEventListener("click", () => {
      if (window.FluxAndroid) window.FluxAndroid.updateEngine();
    });

    fetchBtn.addEventListener("click", () => {
      const u = urlInput.value.trim();
      if (!u) return;
      errorBanner.hidden = true;
      fetchBtn.disabled = true;
      fetchBtn.textContent = "Loading...";
      progressBox.hidden = true;
      if (window.FluxAndroid) window.FluxAndroid.fetchInfo(u);
    });

    function isTrimmed() {
      if (!currentVideo) return false;
      return fromInput.value.trim() !== "0:00" || toInput.value.trim() !== currentVideo.duration_string;
    }

    function updateClipLabel() {
      clipBadge.textContent = isTrimmed()
        ? `${fromInput.value} → ${toInput.value}`
        : `Full (${currentVideo ? currentVideo.duration_string : "0:00"})`;
      dlBtn.textContent = isTrimmed() ? "Download Clip" : "Download to Phone";
    }

    fromInput.addEventListener("input", updateClipLabel);
    toInput.addEventListener("input", updateClipLabel);
    resetTrim.addEventListener("click", () => {
      if (!currentVideo) return;
      fromInput.value = "0:00";
      toInput.value = currentVideo.duration_string;
      updateClipLabel();
    });

    function renderQualities(list) {
      qGrid.innerHTML = "";
      list.forEach((q) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "q-card" + (selectedQ === q.id ? " selected" : "");
        b.innerHTML = `<div class="q-top"><span>${q.badge}</span><span>${q.ext}</span></div>
                       <div class="q-res">${q.resolution}</div>
                       <div class="q-sub">${q.title}</div>`;
        b.addEventListener("click", () => {
          selectedQ = q.id;
          renderQualities(list);
        });
        qGrid.appendChild(b);
      });
    }

    window.onFetchSuccess = (data) => {
      fetchBtn.disabled = false;
      fetchBtn.textContent = "Fetch →";
      currentVideo = data;
      selectedQ = "best_1080";
      vThumb.src = data.thumbnail || "";
      vDur.textContent = data.duration_string || "0:00";
      vPlat.textContent = data.platform || "Video";
      vTitle.textContent = data.title || "Video";
      fromInput.value = "0:00";
      toInput.value = data.duration_string || "0:00";
      renderQualities(data.qualities || []);
      updateClipLabel();
      heroTop.hidden = true;
      chipsRow.hidden = true;
      workspace.hidden = false;
    };

    window.onFetchError = (msg) => {
      fetchBtn.disabled = false;
      fetchBtn.textContent = "Fetch →";
      errorBanner.textContent = msg;
      errorBanner.hidden = false;
    };

    dlBtn.addEventListener("click", () => {
      if (!currentVideo || !window.FluxAndroid) return;
      dlBtn.disabled = true;
      progressBox.hidden = false;
      pStage.textContent = "Downloading...";
      pPct.textContent = "0%";
      pFill.style.width = "0%";
      window.FluxAndroid.startDownload(
        currentVideo.url,
        selectedQ,
        fromInput.value.trim(),
        toInput.value.trim(),
        isTrimmed()
      );
    });

    window.onDownloadProgress = (pct, eta) => {
      pPct.textContent = pct + "%";
      pFill.style.width = pct + "%";
      pStage.textContent = `Downloading (ETA: ${eta})`;
    };

    window.onDownloadComplete = (msg) => {
      dlBtn.disabled = false;
      pPct.textContent = "100%";
      pFill.style.width = "100%";
      pStage.textContent = msg;
    };

    window.onDownloadError = (msg) => {
      dlBtn.disabled = false;
      pStage.textContent = "Error: " + msg;
    };
  </script>
</body>
</html>
