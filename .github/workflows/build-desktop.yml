name: Build FLUXTUBE Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask "yt-dlp[default]" imageio-ffmpeg certifi pywebview pyinstaller

      - name: Build FLUXTUBE.app
        run: |
          pyinstaller --noconfirm --windowed --name FLUXTUBE \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --collect-all imageio_ffmpeg \
            --collect-all certifi \
            app.py
          cd dist && zip -r FLUXTUBE-macOS.zip FLUXTUBE.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLUXTUBE-macOS
          path: dist/FLUXTUBE-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask "yt-dlp[default]" imageio-ffmpeg certifi pywebview pyinstaller

      - name: Build FLUXTUBE.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name FLUXTUBE `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --collect-all imageio_ffmpeg `
            --collect-all certifi `
            app.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLUXTUBE-Windows
          path: dist/FLUXTUBE.exe
